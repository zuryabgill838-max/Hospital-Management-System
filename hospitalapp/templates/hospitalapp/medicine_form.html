{% extends 'hospitalapp/base.html' %}

{% block content %}

<div class="p-6">

    <h1 class="text-2xl font-bold mb-6">
        {{ title }}
    </h1>

    <form method="POST"
          class="bg-white p-6 rounded-lg shadow max-w-xl">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit"
                class="bg-indigo-600 text-white px-5 py-2 rounded">
            Save Medicine
        </button>

    </form>

</div>

{% endblock %}
