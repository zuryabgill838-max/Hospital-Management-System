{% extends 'hospitalapp/base.html' %}

{% block content %}
<div class="p-6 max-w-lg mx-auto">
    <h1 class="text-2xl font-bold mb-4">Login</h1>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit"
                class="bg-indigo-600 text-white px-5 py-2 rounded">
            Login
        </button>
    </form>

    <p class="mt-4">
        New user?
        <a href="{% url 'register' %}">Register</a>
    </p>
</div>
{% endblock %}
