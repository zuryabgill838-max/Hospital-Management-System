{% extends 'hospitalapp/base.html' %}

{% block content %}

<div class="p-6">

    <div class="bg-white p-6 rounded-lg shadow max-w-xl">

        <h1 class="text-2xl font-bold mb-4">
            Delete Medicine
        </h1>

        <p class="mb-6">
            Are you sure you want to delete
            <strong>{{ medicine.name }}</strong>?
        </p>

        <form method="POST">

            {% csrf_token %}

            <button type="submit"
                    class="bg-red-600 text-white px-5 py-2 rounded">
                Yes, Delete
            </button>

            <a href="{% url 'medicine_list' %}"
               class="ml-3 text-gray-600">
                Cancel
            </a>

        </form>

    </div>

</div>

{% endblock %}
