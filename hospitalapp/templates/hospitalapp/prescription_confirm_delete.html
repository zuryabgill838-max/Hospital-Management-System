{% extends 'hospitalapp/base.html' %}

{% block title %}Delete Prescription{% endblock %}

{% block content %}

<div class="max-w-lg mx-auto">

    <div class="bg-white rounded-xl shadow p-6">

        <h1 class="text-xl font-bold mb-4">
            Delete Prescription
        </h1>

        <p class="text-gray-600 mb-6">
            Are you sure you want to delete the prescription
            for <strong>{{ prescription.patient }}</strong>?
        </p>


        <form method="POST">

            {% csrf_token %}

            <button
                type="submit"
                class="bg-red-600 hover:bg-red-700 text-white px-5 py-2 rounded-lg">

                Yes, Delete

            </button>


            <a
                href="{% url 'prescription_list' %}"
                class="ml-2 bg-gray-500 hover:bg-gray-600 text-white px-5 py-2 rounded-lg">

                Cancel

            </a>

        </form>

    </div>

</div>

{% endblock %}
